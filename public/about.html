<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      padding: 0;
      background: #2C2C2C;
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      width: 280px;
      padding: 28px 20px 24px;
      text-align: center;
    }
    img {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .name {
      font-size: 17px;
      font-weight: 700;
      margin: 6px 0 4px;
    }
    .version {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(26, 179, 148, 0.14);
      color: #34d399;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      margin: 4px 0 14px;
      border: 1px solid rgba(52, 211, 153, 0.22);
    }
    .details {
      margin: 6px auto 0;
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .details td {
      padding: 5px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      vertical-align: top;
    }
    .details td:first-child {
      color: #8e929c;
      text-align: left;
      padding-right: 12px;
      white-space: nowrap;
    }
    .details td:last-child {
      text-align: right;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="App logo" id="logo" />
    <div class="name" id="name">XPAM</div>
    <div class="version" id="version">Version</div>
    <table class="details" id="details"></table>
  </div>
  <script>
    // Values come from the client's main process (server public settings); rendered as text only.
    const params = new URLSearchParams(window.location.search);
    const value = (key) => (params.get(key) || '').trim();
    const appName = value('name') || 'XPAM';
    const serverVersion = value('serverVersion');
    const clientVersion = value('version');
    const withV = (v) => (v && !/^v/i.test(v) ? `v${v}` : v);

    document.title = `About ${appName}`;
    const logoEl = document.getElementById('logo');
    logoEl.alt = appName;
    const logo = value('logo');
    if (/^https?:\/\//i.test(logo)) {
      logoEl.onerror = () => { logoEl.onerror = null; logoEl.src = '/logo.png'; };
      logoEl.src = logo;
    }
    document.getElementById('name').textContent = appName;
    document.getElementById('version').textContent = withV(serverVersion || clientVersion) || 'Version';

    const rows = [
      ['Edition', value('edition')],
      ['License company', value('company')],
      ['Server', value('server')],
      ['Client version', withV(clientVersion)]
    ];
    const table = document.getElementById('details');
    for (const [label, text] of rows) {
      if (!text) continue;
      const row = table.insertRow();
      row.insertCell().textContent = label;
      row.insertCell().textContent = text;
    }
    if (!value('server')) {
      const row = table.insertRow();
      row.insertCell().textContent = 'Server';
      row.insertCell().textContent = 'Not connected';
    }
  </script>
</body>
</html>
