minimumReleaseAgeExclude:
  - "@ai-sdk/gateway@4.0.33"
  - "@ai-sdk/provider-utils@5.0.16"
  - "@ai-sdk/vue@4.0.44"
  - ai@7.0.44
shellEmulator: true
nodeLinker: hoisted

overrides:
  "@electron/rebuild": 4.2.0
  # builder 26.15.3 uses ElectronDownloadCacheMode, which @electron/get 3 does not export.
  "app-builder-lib@26.15.3>@electron/get": 5.1.0
  cpu-features: "-"
  # Security floors for indirect dependencies (same major versions as before).
  # Remove an entry once the packages that pull it in require the fixed version themselves.
  "brace-expansion@^2": ^2.1.6
  "brace-expansion@^5": ^5.0.11
  devalue: ^5.9.3
  "fast-uri@^3": ^3.1.7
  "js-yaml@^4": ^4.3.2
  "nanoid@^3": ^3.3.18
  seroval: ^1.6.3
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2
  "svgo@^4": ^4.1.0
  # editor packages are released together; keep them on one fixed version
  "@tiptap/core": ^3.30.5
  "@tiptap/pm": ^3.30.5
  "undici@^7": ^7.29.1
  "undici@^8": ^8.10.2
  # one copy of the framework runtime for every package in the workspace
  vue: ^3.5.42

packages:
  - .
  - electron
  - packages/*
  - applets/*

allowBuilds:
  "@bitdisaster/exe-icon-extractor": true
  "@parcel/watcher": true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  node-pty: true
  ssh2: false
  unrs-resolver: true
  vue-demi: true

patchedDependencies:
  appdmg@0.6.6: patches/appdmg@0.6.6.patch
  asciinema-player@3.17.0: patches/asciinema-player@3.17.0.patch
  guacamole-common-js-jumpserver@1.1.0-c: >-
    patches/guacamole-common-js-jumpserver@1.1.0-c.patch
